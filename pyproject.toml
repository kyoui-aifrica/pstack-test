[project]
name = "document-ingestion-pipeline"
version = "0.1.0"
description = "HWP·HWPX·PDF 문서를 부모-자식 청크로 나눠 PostgreSQL 또는 OpenSearch에 적재하는 파이프라인"
readme = "README.md"
authors = [
    { name = "kyoui-aifrica", email = "kh.kim@aifrica.co.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "kordoc==0.2.1",
    "openai>=3.45.0",
    "opensearch-py>=3.2.0",
    "psycopg[binary]>=3.3.7",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
ingest = "document_ingestion_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "SIM",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
